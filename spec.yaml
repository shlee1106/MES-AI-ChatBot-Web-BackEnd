openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: http://localhost:8080
    description: Generated server url
paths:
  /api/v1/password/update:
    post:
      tags:
        - email-controller
      operationId: updatePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdateRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            'text/plain':
              schema:
                type: string
  /api/v1/password/request:
    post:
      tags:
        - email-controller
      operationId: requestResetEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            'text/plain':
              schema:
                type: string
  /api/v1/jwt/refresh:
    post:
      tags:
        - jwt-controller
      operationId: refresh
      parameters:
        - name: refreshToken
          in: cookie
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            'text/plain':
              schema:
                type: string
  /api/v1/files/upload:
    post:
      tags:
        - file-controller
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileUploadResponseDto"
  /api/v1/chat/sessions/{sessionId}/ask:
    post:
      tags:
        - chat-controller
      operationId: askToLlm
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserQuestionDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskResponseDto"
  /api/v1/chat/sessionrooms:
    post:
      tags:
        - chat-controller
      operationId: createChatSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatSessionRequestDto"
        required: true
      responses:
        "200":
          description: OK
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/ChatSessionResponseDto"
  /api/v1/admin/users:
    post:
      tags:
        - join-controller
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRequestDTO"
        required: true
      responses:
        "200":
          description: OK
          content:
            'text/plain':
              schema:
                type: string
  /api/v1/users/{target}:
    delete:
      tags:
        - user-controller
      operationId: deleteUser
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            'text/plain':
              schema:
                type: string
    patch:
      tags:
        - user-controller
      operationId: updateRole
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: string
        required: true
      responses:
        "200":
          description: OK
          content:
            'text/plain':
              schema:
                type: string
  /api/v1/users/me:
    get:
      tags:
        - user-controller
      operationId: getMyInfo
      responses:
        "200":
          description: OK
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/UserInfoResponseDTO"
  /api/v1/users/:
    get:
      tags:
        - user-controller
      operationId: getUserForAdmin
      responses:
        "200":
          description: OK
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserInfoResponseDTO"
  /api/v1/password/token/{token}:
    get:
      tags:
        - email-controller
      operationId: verifyToken
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            'application/json':
              schema:
                type: boolean
  /api/v1/chat/sessions/{sessionId}/histories:
    get:
      tags:
        - chat-controller
      operationId: getChatHistories
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatHistory"
  /api/v1/files/delete/{fileId}:
    delete:
      tags:
        - file-controller
      operationId: delete
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/FileDeleteResponseDto"
  /api/v1/login:
    post:
      tags:
        - login-filter
      operationId: post
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                companyId:
                  type: integer
                  format: int64
                  example: 0
                employeeId:
                  type: integer
                  format: int64
                  example: 0
                password:
                  type: string
      responses:
        "200":
          description: "OK"
          content:
            'application/json':
              schema:
                type: object
                properties:
                  refreshToken:
                    type: string
components:
  schemas:
    PasswordUpdateRequestDTO:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
    PasswordResetRequestDTO:
      type: object
      properties:
        companyId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        email:
          type: string
    Company:
      type: object
      properties:
        companyId:
          type: integer
          format: int64
        companyName:
          type: string
        createdAt:
          type: string
          format: date-time
    FileMetadata:
      type: object
      properties:
        fileId:
          type: string
        companyId:
          $ref: "#/components/schemas/Company"
        employeeId:
          $ref: "#/components/schemas/UserMember"
        originName:
          type: string
        fileType:
          type: string
        uploadedAt:
          type: string
          format: date-time
    FileUploadResponseDto:
      type: object
      properties:
        message:
          type: string
        fileData:
          $ref: "#/components/schemas/FileMetadata"
        parsedData:
          type: array
          items:
            $ref: "#/components/schemas/UploadDataDetailsDto"
    GrantedAuthority:
      type: object
      properties:
        authority:
          type: string
    UploadDataDetailsDto:
      type: object
      properties:
        dataId:
          type: integer
          format: int32
        companyId:
          type: integer
          format: int64
        fileId:
          type: string
        rowNumber:
          type: integer
          format: int32
        rowData:
          type: string
        createdAt:
          type: string
          format: date-time
    UserMember:
      type: object
      properties:
        employeeId:
          type: integer
          format: int64
        companyId:
          $ref: "#/components/schemas/Company"
        username:
          type: string
        password:
          type: string
        companyEmail:
          type: string
        roleCode:
          type: string
          enum:
            - ROLE_MASTER
            - ROLE_MANAGER
            - ROLE_USER
        createdAt:
          type: string
          format: date-time
        authorities:
          type: array
          items:
            $ref: "#/components/schemas/GrantedAuthority"
        accountNonLocked:
          type: boolean
        accountNonExpired:
          type: boolean
        credentialsNonExpired:
          type: boolean
        enabled:
          type: boolean
    UserQuestionDto:
      type: object
      properties:
        message:
          type: string
    AskResponseDto:
      type: object
      properties:
        chatId:
          type: string
        companyId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        sessionId:
          type: string
        message:
          type: string
        recordedAt:
          type: string
          format: date-time
        role:
          type: string
    ChatSessionRequestDto:
      type: object
      properties:
        title:
          type: string
    ChatSessionResponseDto:
      type: object
      properties:
        sessionId:
          type: string
        companyId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        sessionTitle:
          type: string
        createdAt:
          type: string
          format: date-time
    JoinRequestDTO:
      type: object
      properties:
        companyId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        password:
          type: string
          minLength: 1
          pattern: "^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[@$!%*#?&])[A-Za-z0-9@$!%*#?&]{8,20}$"
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        role:
          type: string
          enum:
            - ROLE_MASTER
            - ROLE_MANAGER
            - ROLE_USER
      required:
        - companyId
        - email
        - employeeId
        - password
        - role
        - username
    UserInfoResponseDTO:
      type: object
      properties:
        companyId:
          type: integer
          format: int64
        employeeId:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - ROLE_MASTER
            - ROLE_MANAGER
            - ROLE_USER
        companyName:
          type: string
        createdAt:
          type: string
          format: date-time
    ChatHistory:
      type: object
      properties:
        chatId:
          type: string
        companyId:
          $ref: "#/components/schemas/Company"
        employeeId:
          $ref: "#/components/schemas/UserMember"
        sessionId:
          $ref: "#/components/schemas/ChatSession"
        message:
          type: string
        recordedAt:
          type: string
          format: date-time
        role:
          type: string
        new:
          type: boolean
        id:
          type: string
    ChatSession:
      type: object
      properties:
        sessionId:
          type: string
        companyId:
          $ref: "#/components/schemas/Company"
        employeeId:
          $ref: "#/components/schemas/UserMember"
        sessionTitle:
          type: string
        createdAt:
          type: string
          format: date-time
    FileDeleteResponseDto:
      type: object
      properties:
        fileId:
          type: string
        message:
          type: string
        deletedAt:
          type: string
          format: date-time
