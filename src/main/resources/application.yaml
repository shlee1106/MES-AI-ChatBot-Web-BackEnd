spring:
  config:
    import:
      - optional:classpath:application-secrets.yaml
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        auto_qu
  ai:
    vectorstore:
      mongodb:
        initialize-schema: true
    model:
      embedding: ollama
      chat: openai
    ollama:
      embedding:
        model: embeddinggemma:latest
  application:
    name: MESAIChatBotWebBackEnd
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/mes
  mongodb:
    database: springrag
    authentication-database: admin
    host: localhost
    port: 27017
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB