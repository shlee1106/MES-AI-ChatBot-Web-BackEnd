spring:
  config:
    import:
      - optional:classpath:application-secrets.yaml
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    vectorstore:
      mongodb:
        initialize-schema: true
    model:
      embedding: ollama
      chat: openai
    ollama:
      embedding:
        model:
          ${EMBEDDING_MODEL:embeddinggemma:latest}
      base-url: http://${OLLAMA_HOST:localhost}:11434
  application:
    name: MESAIChatBotWebBackEnd
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${DATABASE_NAME:mes}
  mongodb:
    database: ${DATABASE_NAME:mes}
    authentication-database: admin
    host: ${MONGODB_HOST:localhost}
    port: 27017
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB