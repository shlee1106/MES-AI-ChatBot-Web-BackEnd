spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:JWTtestdb}?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:admin}        # 실제 MySQL 계정명
    password: ${MYSQL_PASSWORD:a@001338}     # 실제 MySQL 비밀번호

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      # host: host.docker.internal
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME} #발신자 이메일
    password: ${SMTP_PASSWORD} #이메일 앱 비밀번호 16자리
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# jwt는 spring과 같은 라인(제일 왼쪽)에 있어야 합니다.
jwt:
  secret: hello-my-name-is-dev-yummi-im-korean-web-dev-and-youtuber
  access-token-expire-time: 600000
  refresh-token-expire-time: 2592000000
