                type: object
                properties:
                  status:
                    type: string
                    x-stoplight:
                      id: x8d30rrkvo0mz
                  message:
                    type: string
                    x-stoplight:
                      id: lbv7m4hfwqq8d
              examples:
                Example 1:
                  value:
                    status: Unauthorized
                    message: 아이디 또는 비밀번호가 틀렸습니다.
      operationId: post-api-v1-auth-login
      description: "설명: 로그인 (사원번호/비밀번호 인증)\r\n\r\nRequest Body: CredentialsNosql (또는 로그인용 ID/PW 객체)\r\n\r\nResponse: JWT 토큰 및 로그인 유저 정보"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                companyId:
                  type: integer
                loginData:
