                Example 1:
                  value:
                    status: OK
                    message: 로그인에 성공하셨습니다.
                    companyId: 814324
                    data:
                      id: '20260526'
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTc4MTU4NzA4NX0.J3Hle-5eGdhLfr3aERdNZtdVpAs9gV2XdZ2Ea4x49Tk
