spring:
  web:
    resources:
      add-mappings: false
  ai:
    vectorstore:
      mongodb:
        initialize-schema: true
    model:
      embedding: none
      chat: openai
    ollama:
      embedding:
        model:
          ${EMBEDDING_MODEL:embeddinggemma:latest}
      base-url: http://${OLLAMA_HOST:localhost}:11434
      init:
        pull-model-strategy: when_missing
    openai:
      api-key: tgpt_sk_a6758ae08cc78be16db29aa51263eafe8a3535cff0010a805bf12994af947e16
      base-url: https://hello.timelyai.io/api/v2/chat/bridge/openai
  application:
    name: MESAIChatBotWebBackEnd
  mongodb:
    database: ${DATABASE_NAME:mes}
    authentication-database: admin
    host: ${MONGODB_HOST:localhost}
    port: 27017
    username: testuser
    password: secret
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    hikari:
      connection-test-query: 'SELECT 1'
      max-lifetime: 1800000
      idle-timeout: 600000
      validation-timeout: 3000
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:JWTtestdb}?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:testuser}        # 실제 MySQL 계정명
    password: ${MYSQL_PASSWORD:testpassword}     # 실제 MySQL 비밀번호
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  data:
    redis:
      # host: host.docker.internal
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME} #발신자 이메일
    password: ${SMTP_PASSWORD} #이메일 앱 비밀번호 16자리
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaEmbeddingAutoConfiguration
      - org.springframework.ai.vectorstore.mongodb.autoconfigure.MongoDBAtlasVectorStoreAutoConfiguration
